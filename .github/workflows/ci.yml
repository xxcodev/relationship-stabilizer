name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      # browser-layer tests need a real Chrome/Chromium and are excluded on CI
      - run: node --test test/planner.test.js test/planner-random.test.js test/db.test.js test/db-config.test.js test/db-sql.test.js test/db-postgres.test.js test/migration-006.test.js test/importer.test.js test/api-proto.test.js test/api-session.test.js test/api-sender.test.js test/api-export.test.js test/api-feed.test.js test/video-picker.test.js test/friend-picker.test.js test/pools.test.js test/scheduler-feed.test.js test/dashboard.test.js test/dashboard-external.test.js test/ai.test.js test/ai-assistant.test.js
