name: build-app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            standard: app:dist:mac
            bundled: app:dist:mac:bundled
          - os: windows-latest
            standard: app:dist:win
            bundled: app:dist:win:bundled
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install bundled Chromium (for the self-contained variant)
        run: npx playwright-core install chromium --no-shell
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
      - name: Build standard (system Chrome)
        run: npm run ${{ matrix.standard }}
      - name: Build bundled (self-contained Chromium)
        run: npm run ${{ matrix.bundled }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
